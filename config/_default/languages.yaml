      name: "2026-2027"
      url: "/exec/2026-2027"
      weight: 1
      parent: "executives"
    - identifier: "events"
      name: "Events"
      url: "/events/"
      weight: 3
    - identifier: "seminars"
      name: "CS Grad Seminars"
      url: "/events/seminars"
      weight: 1
      post: "A seminar series where the speakers are graduate students."
      parent: "events"
